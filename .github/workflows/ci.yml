name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  compiler: gcc,   cc: gcc,   cxx: g++ }
          - { os: ubuntu-latest,  compiler: clang, cc: clang, cxx: clang++ }
          - { os: macos-latest,   compiler: clang, cc: clang, cxx: clang++ }
          - { os: windows-latest, compiler: msvc,  cc: cl,    cxx: cl }
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAGSS_WERROR=ON
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with sanitizers
        # These would have caught the uncaught std::invalid_argument and
        # std::out_of_range that used to abort the engine on malformed input.
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DAGSS_SANITIZE=ON
        env: { CC: clang, CXX: clang++ }
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  correctness:
    name: Differential correctness
    runs-on: ubuntu-latest
    # Left unbounded this job once held CI open for over half an hour. The
    # cause was verify rebuilding the CH index per sample; with that fixed the
    # whole sweep takes seconds, and the cap keeps a regression visible.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - name: Every optimal algorithm must agree, on each kind of network
        run: |
          fail=0
          # One sweep, one network of each character. There were two loops
          # here: this one, and a second that swept every directory under
          # data/cities and data/networks at 40 samples with no exclusions.
          # That was affordable when the extracts were 15k-33k junctions and
          # became untenable at 240k-488k, where Johnson is V Dijkstras and
          # Bellman-Ford is O(VE) -- it ran CI past half an hour.
          #
          # Mutual agreement between optimal algorithms is the oracle, so what
          # earns a slot is a distinct kind of graph, not another city that
          # looks like the last one: the integer grid, which is the only place
          # Dial and Floyd-Warshall apply; a small real city cheap enough to
          # run every algorithm against; a coastal network that is genuinely
          # disconnected in places; the largest extract at 488k junctions; the
          # hierarchical highway skeleton; and the sparse national rail graph.
          # Johnson and Bellman-Ford are skipped above city scale, where they
          # cost minutes and add nothing the others do not already cover.
          for spec in "data/maps/Grid_Integer:80::" \
                      "data/cities/Gorakhpur:60:--geo:" \
                      "data/cities/Mumbai:30:--geo:johnson,bellmanford" \
                      "data/cities/Delhi_NCR:15:--geo:johnson,bellmanford" \
                      "data/networks/India_Highways:25:--geo:johnson,bellmanford" \
                      "data/networks/India_Railways:40:--geo:johnson,bellmanford" ; do
            map=${spec%%:*}; rest=${spec#*:}
            n=${rest%%:*}; rest=${rest#*:}
            geo=${rest%%:*}; skip=${rest#*:}
            args=""
            [ -n "$skip" ] && args="--skip $skip"
            echo "== $map $geo $args (samples $n)"
            out=$(./build/bin/agss verify --graph "$map" $geo $args --samples "$n")
            echo "$out"
            # A warning here means the map violates heuristic admissibility,
            # which makes A* legitimately suboptimal -- a data bug, not a
            # search bug, and one that must not reach main.
            if echo "$out" | grep -q "WARNING"; then
              echo "::error::$map breaks the straight-line heuristic invariant"
              fail=1
            fi
            if ! echo "$out" | grep -q "0 cost mismatches, 0 invalid paths"; then
              echo "::error::$map produced disagreements between optimal algorithms"
              fail=1
            fi
          done
          exit $fail

  data-reproducibility:
    name: Bundled maps are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerating with the default seed must be a no-op
        run: |
          python3 scripts/generate_maps.py
          if ! git diff --quiet -- data/maps; then
            echo "::error::regenerating the maps changed them; the generator is not deterministic"
            git --no-pager diff --stat -- data/maps
            exit 1
          fi
          echo "maps are byte-identical after regeneration"

  benchmarks:
    name: Publish benchmark table
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - name: Benchmark every algorithm across every bundled map
        run: |
          {
            echo "## Benchmark results"
            echo
            echo "Runner: \`${{ runner.os }}\`, commit \`${GITHUB_SHA::8}\`"
            echo
            ./build/bin/agss bench --markdown --reps 7
          } >> "$GITHUB_STEP_SUMMARY"

  wasm:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.61
      - name: Configure
        run: emcmake cmake -S . -B build/wasm -DCMAKE_BUILD_TYPE=Release
                 -DAGSS_BUILD_TESTS=OFF -DAGSS_BUILD_CLI=OFF
      - run: cmake --build build/wasm --parallel
      - name: Smoke-test the module headlessly
        # Proves the browser engine agrees with the native one, so a broken
        # WASM build cannot reach the published demo.
        run: node tests/wasm_smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-engine
          path: web/engine/

  python:
    name: Python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pybind11 scikit-build-core numpy pytest
      - name: Build and install the extension
        run: pip install --no-build-isolation -e .
      - run: pytest python/tests -q

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: distro clang-format versions disagree about formatting, so an
      # unpinned check fails depending on which runner image is current.
      - run: pip install clang-format==18.1.8
      - run: |
          find src include tests \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
