name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deployment; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.61

      - name: Build the engine for the browser
        run: |
          emcmake cmake -S . -B build/wasm -DCMAKE_BUILD_TYPE=Release \
            -DAGSS_BUILD_TESTS=OFF -DAGSS_BUILD_CLI=OFF
          cmake --build build/wasm --parallel

      - name: Verify the module before publishing it
        run: node tests/wasm_smoke.mjs

      # City extracts, metro and railway data are all committed, so the deploy
      # is self-contained and cannot be broken by an Overpass outage.

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r web/* site/
          mkdir -p site/data
          cp -r data/maps data/transit data/railways data/cities data/networks site/data/
          # In the repo the page sits in web/ with data one level up. On Pages
          # they are siblings, so retarget the single constant that says where
          # data lives, and fail loudly if that line ever moves.
          grep -q "const DATA_ROOT = '../data';" site/app.js || {
            echo "::error::DATA_ROOT line not found in app.js; the Pages rewrite is stale"
            exit 1
          }
          sed -i "s|const DATA_ROOT = '../data';|const DATA_ROOT = 'data';|" site/app.js
          du -sh site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
